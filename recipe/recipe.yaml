schema_version: 1

context:
  name: dbt-snowflake
  version: 1.12.4

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 83efb205b84ed0f9ddc9e6a78f5aa7205f1ffb4b23dfbf36d55dacf31478ff9e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - hatchling
  run:
    - python >=${{ python_min }}
    - dbt-common >=1.10,<2.0
    - dbt-adapters >=1.24.4,<2.0
    - snowflake-connector-python >=4.2.0,<5.0.0
    - certifi >=2026.10.19
    - dbt-core >=1.10.0rc0,<2.0
    - agate
    - pyopenssl >=24.0.0
tests:
  - python:
      imports:
        - dbt.adapters.snowflake
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: The Snowflake adapter plugin for dbt
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/dbt-labs/dbt-snowflake

extra:
  recipe-maintainers:
    - rxm7706
    - maresb
    - thewchan
